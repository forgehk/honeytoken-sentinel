[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeytoken-sentinel"
version = "0.1.0"
description = "Mint decoy credentials and alert when they're touched."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "@forgehk", email = "info@darkforgeai.com" }]
keywords = ["security", "honeytoken", "canary", "detection", "intrusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
honeytoken = "honeytoken.cli:main"

[tool.setuptools.packages.find]
include = ["honeytoken*"]
